[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "runtime-llama"
version = "0.4.1"
description = "Python adapters for llama.cpp HTTP servers: streaming, tool calls, embeddings and replica discovery"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "src/runtime_llama/_vendor/llamatelemetry.LICENSE"]
authors = [{name = "Davide Mele"}]
dependencies = ["requests>=2.31,<3"]

[project.urls]
Repository = "https://github.com/Damel91/llama-runtime"
Documentation = "https://github.com/Damel91/llama-runtime#readme"
Issues = "https://github.com/Damel91/llama-runtime/issues"

[project.optional-dependencies]
dev = ["build>=1.2,<2", "pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["runtime_llama*"]

[tool.setuptools.package-data]
runtime_llama = ["py.typed", "_vendor/*.LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
