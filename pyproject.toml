[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "runtime-llama"
version = "0.20.3"
description = "Python inference client and optional local HTTP relay for llama.cpp and Strata, with routing, streaming, tools and embeddings"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "src/runtime_llama/_vendor/llamatelemetry.LICENSE"]
authors = [{name = "Davide Mele"}]
dependencies = ["requests>=2.31,<3", "urllib3>=1.26.20,<3", "jsonschema>=4.23,<5"]

[project.urls]
Repository = "https://github.com/Damel91/llama-runtime"
Documentation = "https://github.com/Damel91/llama-runtime#readme"
Issues = "https://github.com/Damel91/llama-runtime/issues"

[project.optional-dependencies]
relay = ["starlette>=1.0,<2", "uvicorn>=0.42,<1"]
dev = ["build>=1.2,<2", "httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
llama-runtime-relay = "runtime_llama.relay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["runtime_llama*"]

[tool.setuptools.package-data]
runtime_llama = ["py.typed", "_vendor/*.LICENSE", "calibration_corpus/*.json", "calibration_corpus/*.jsonl", "calibration_corpus/*.md", "relay/static/*.html", "relay/static/*.css", "relay/static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
